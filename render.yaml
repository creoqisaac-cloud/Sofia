# Render Blueprint (plan GRATUITO) + Supabase (base de datos y documentos, también gratis).
# New → Blueprint → este repo. Datos y documentos viven en Supabase; el disco de Render no se usa
# (en el plan gratis se borra en cada reinicio).
services:
  - type: web
    name: sofia
    runtime: docker
    plan: free
    region: oregon
    branch: claude/laughing-sagan-hbxj3y
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Supabase → Project Settings → Database → Connection string → "Session pooler" (puerto 5432)
      - key: DATABASE_URL
        sync: false
      # Supabase → Project Settings → API: Project URL y la llave service_role (secreta; solo servidor)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOFIA_BASIC_AUTH
        sync: false # usuario:contraseña de la tablet
      - key: SOFIA_SECRET_KEY
        generateValue: true # cifra la contraseña del correo de Sofía (nunca en git)
      - key: SOFIA_AUTO_MIGRATE
        value: "true"
      - key: SOFIA_AUTO_SEED
        value: "true"
      - key: SOFIA_DB_POOL_MAX
        value: "3"
      - key: SOFIA_LLM_PROVIDER
        value: demo
