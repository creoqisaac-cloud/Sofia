# Despliegue con la terminal:  cd prueba/servidor/cloudflare && npx wrangler deploy
# Antes: npx wrangler kv namespace create SOFIA_KV  → pega el id abajo.
# Secretos: npx wrangler secret put SOFIA_TOKEN  (y los de Meta, ver CONEXIONES.md)
name = "sofia-conector"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[[kv_namespaces]]
binding = "SOFIA_KV"
id = "PEGA_AQUI_EL_ID_DEL_KV"

# Programador de publicaciones: cada 5 minutos publica lo que ya tocaba (el plan gratis permite hasta 5 crons).
[triggers]
crons = ["*/5 * * * *"]

# IA gratis de Cloudflare para la vendedora (Workers AI, cuota diaria sin costo). En el panel:
# tu Worker → Settings → Bindings → Add → Workers AI, con el nombre de variable AI.
[ai]
binding = "AI"
