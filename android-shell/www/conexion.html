<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sofía · Conexión</title>
<style>
  :root { --ink:#0a0a0b; --raise:#1c1c1f; --ivory:#f3f1ec; --dim:#9a9a9f; --sand:#e7d3ae; --alert:#f0a35e; --good:#8fcf9b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--ink); color:var(--ivory); font-family:system-ui,-apple-system,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 40px) 24px 40px; }
  .brand { letter-spacing:.32em; color:var(--sand); font-weight:600; font-size:14px; }
  h1 { font-size:28px; margin:24px 0 8px; }
  p { color:var(--dim); line-height:1.5; font-size:16px; }
  label { display:block; margin-top:20px; color:var(--dim); font-size:14px; }
  input { width:100%; margin-top:6px; padding:14px; border-radius:14px; border:0; background:var(--raise); color:var(--ivory); font-size:18px; }
  button { width:100%; margin-top:24px; min-height:54px; border:0; border-radius:16px; background:var(--sand); color:var(--ink); font-size:18px; font-weight:600; }
  .secondary { background:var(--raise); color:var(--ivory); font-weight:400; }
  .msg { margin-top:16px; min-height:22px; }
  .err { color:var(--alert); } .ok { color:var(--good); }
</style>
</head>
<body>
<main>
  <div class="brand">SOFÍA</div>
  <h1>Conexión</h1>
  <p id="why">Escribe la dirección HTTPS del servidor de Sofía. Si no hay servidor disponible, la app se queda en esta pantalla en vez de ponerse negra.</p>
  <form id="f">
    <label>Dirección del servidor
      <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://sofia-xxxx.onrender.com" required>
    </label>
    <label>Usuario
      <input id="user" autocomplete="off" autocapitalize="off">
    </label>
    <label>Contraseña
      <input id="pass" type="password" autocomplete="off">
    </label>
    <button type="submit">Guardar y conectar</button>
    <button type="button" class="secondary" id="retry">Reintentar</button>
    <div id="msg" class="msg"></div>
  </form>
  <p style="margin-top:32px;font-size:13px">La dirección y la contraseña se guardan solo en esta tablet.</p>
</main>
<script>
(function () {
  var why = document.getElementById("why");
  var msg = document.getElementById("msg");

  if (/auth=1/.test(location.search)) why.textContent = "El servidor rechazó el usuario o la contraseña. Corrígelos abajo.";
  else if (/timeout=1/.test(location.search)) why.textContent = "El servidor tardó demasiado en responder. Revisa la dirección.";
  else if (/network=1/.test(location.search)) why.textContent = "No pude alcanzar el servidor. Revisa internet o la dirección.";
  else if (/ssl=1/.test(location.search)) why.textContent = "La conexión HTTPS del servidor no es válida.";
  else if (/http=/.test(location.search)) why.textContent = "El servidor respondió con un error. Revisa la dirección.";

  function plugin() {
    return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SofiaServer;
  }

  function waitPlugin() {
    return new Promise(function (resolve) {
      var tries = 0;
      (function tick() {
        var p = plugin();
        if (p) return resolve(p);
        if (++tries >= 20) return resolve(null);
        setTimeout(tick, 100);
      })();
    });
  }

  // Servidor gratuito dormido: tarda ~1 minuto en despertar. Reintento automático visible (máx. ~3 min).
  function autoRetry(p, savedUrl) {
    if (!savedUrl || !/timeout=1|network=1|http=50[234]/.test(location.search)) return;
    var KEY = "sofiaWake";
    var now = Date.now();
    var st = {};
    try { st = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { st = {}; }
    if (!st.start || now - st.start > 5 * 60000) st = { start: now, n: 0 };
    if (now - st.start > 3 * 60000) {
      why.textContent = "El servidor no respondió en 3 minutos. Revisa internet o la dirección y toca Reintentar.";
      localStorage.removeItem(KEY);
      return;
    }
    st.n += 1;
    localStorage.setItem(KEY, JSON.stringify(st));
    var left = 15;
    why.textContent = "Sofía se está despertando (servidor gratuito, puede tardar hasta un minuto)…";
    msg.className = "msg ok";
    (function tick() {
      msg.textContent = "Reintento automático en " + left + " s (intento " + st.n + ")";
      if (left-- <= 0) return p.reload();
      setTimeout(tick, 1000);
    })();
  }

  waitPlugin().then(function (p) {
    if (!p) {
      msg.className = "msg err";
      msg.textContent = "No pude cargar el puente nativo. Cierra Sofía por completo y vuelve a abrirla.";
      return;
    }
    p.get().then(function (c) {
      var u = c && c.url ? String(c.url) : "";
      if (u && !/192\.168\.1\.100/.test(u)) document.getElementById("url").value = u;
      document.getElementById("user").value = c && c.user ? c.user : "";
      autoRetry(p, u);
    }).catch(function () {});
  });

  document.getElementById("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var p = await waitPlugin();
    var url = document.getElementById("url").value.trim().replace(/\/+$/, "");

    if (!/^https?:\/\/[^\s]+$/.test(url)) {
      msg.className = "msg err";
      msg.textContent = "La dirección debe empezar con https:// o http://";
      return;
    }
    if (!p) {
      msg.className = "msg err";
      msg.textContent = "El puente nativo no está disponible.";
      return;
    }

    msg.className = "msg ok";
    msg.textContent = "Conectando…";
    p.set({
      url: url,
      user: document.getElementById("user").value.trim(),
      pass: document.getElementById("pass").value
    }).catch(function () {
      msg.className = "msg err";
      msg.textContent = "No pude guardar la configuración.";
    });
  });

  document.getElementById("retry").addEventListener("click", async function () {
    var p = await waitPlugin();
    if (p) p.reload();
  });
})();
</script>
</body>
</html>
