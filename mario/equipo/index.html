</head><body><div id="app"><header class="header"><div class="brand"><span class="brand-mark">S</span><div><div class="brand-name">SOFÍA <span class="brand-light">/ EQUIPO</span></div><div class="brand-sub">HONDA VALLE ORIENTE</div></div></div><div class="header-tools"><span id="offlineIndicator" class="connect-indicator">En línea</span><button class="icon-btn" id="openQuick" style="display:none" title="Nuevo cliente" aria-label="Nuevo cliente">＋</button></div></header>

<dialog id="sheet" aria-label="Editar registro"><div id="sheetBody"></div></dialog>

<script src="./cloud-db.js?v=1" defer></script>
