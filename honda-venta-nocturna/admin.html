<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180c25"><title>Panel privado · Honda Valle Oriente</title><style>*{box-sizing:border-box}body{background:#120c1c;color:#fff;font:14px system-ui,Arial,sans-serif;margin:0;padding:20px}main{max-width:1200px;margin:auto}h1{font-size:30px;margin:6px 0 3px}h2{color:#ffa45e;font-size:18px}.sub{color:#c2adce;margin:0 0 18px}.stat{display:inline-block;padding:16px 25px;background:#281a35;border:1px solid #493052;border-radius:12px;margin:8px 10px 16px 0}.stat b{display:block;font-size:30px;color:#ff9c49}.btn{display:inline-block;border:none;padding:12px 18px;background:#fb9a43;border-radius:9px;color:#17101d;font-weight:700;cursor:pointer;margin:7px 10px 16px 0}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:820px;background:#21162d}th,td{padding:11px 13px;border-bottom:1px solid #413348;text-align:left}th{background:#38213d;color:#ffb86a}tr:nth-child(even){background:#2a1b34}small{color:#c1b2c4}</style></head><body><main><h1>🎃 Honda Valle Oriente</h1><p class="sub">Registro de clientes | Venta nocturna 16 de octubre</p><div class="stat">Clientes<b id="clients">...</b></div><div class="stat">Asistentes<b id="people">...</b></div><div class="stat">Personas para la cena<b id="food">...</b></div><br><button class="btn" id="refresh">↻ Actualizar</button><button class="btn" id="csv">↓ Descargar lista para Excel</button><h2>Lista de registros</h2><p id="status">Cargando...</p><div class="wrap"><table><thead><tr><th>Registro</th><th>Cliente</th><th>WhatsApp</th><th>Asesor</th><th>Llegada</th><th>Modelo</th><th>Asistentes</th><th>Cena</th></tr></thead><tbody id="entries"></tbody></table></div><p><small>Panel privado: no compartas el enlace con clientes.</small></p></main><script>
const api="https://ixgsjjpxkhiocuapzyby.supabase.co/functions/v1/honda-valle-oriente-venta-nocturna";
const token=decodeURIComponent(location.hash.slice(1));
const el=id=>document.getElementById(id);
async function load(){if(!token){el("status").textContent="Falta el código privado del panel.";return;}el("status").textContent="Actualizando...";try{const r=await fetch(api+"?panel="+encodeURIComponent(token)+"&format=json");if(!r.ok)throw Error("No se pudo acceder al panel. Revisa el enlace.");const x=await r.json();el("clients").textContent=x.registros.length;el("people").textContent=x.registros.reduce((n,r)=>n+r.asistentes,0);el("food").textContent=x.registros.reduce((n,r)=>n+(r.participa_cena?r.asistentes:0),0);el("entries").replaceChildren();for(const row of x.registros){let tr=document.createElement("tr");const cells=[new Date(row.created_at).toLocaleString("es-MX",{timeZone:"America/Monterrey"}),row.nombre,row.telefono,row.asesor,row.hora_llegada,row.vehiculo_interes,row.asistentes,row.participa_cena?"Sí":"No"];for(const s of cells){let td=document.createElement("td");td.textContent=s;tr.append(td);}el("entries").append(tr);}el("status").textContent=x.registros.length?"Datos actualizados.":"Aún no hay registros.";}catch(e){el("status").textContent=e.message;}}
el("refresh").addEventListener("click",load);
el("csv").addEventListener("click",async()=>{if(!token)return;try{const r=await fetch(api+"?panel="+encodeURIComponent(token)+"&csv=1");if(!r.ok)throw Error("No se pudo descargar.");const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="registros-honda-valle-oriente.csv";document.body.append(a);a.click();a.remove();URL.revokeObjectURL(u);}catch(e){el("status").textContent=e.message}});
load();
</script></body></html>
